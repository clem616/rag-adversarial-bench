[project]
name = "rag-adversarial-bench"
version = "1.0.0"
description = "Eight-pillar adversarial evaluation framework for RAG systems — plug in your system, get a dual Retrieval/Generation scorecard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["rag", "evaluation", "benchmark", "adversarial", "llm", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

authors = [
    { name = "RAG-Adversarial-Bench Contributors" },
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "langchain-text-splitters>=0.2.0",
]

[project.urls]
Repository = "https://github.com/rag-adversarial-bench/rag-adversarial-bench"
# Paper URL will be added here upon arXiv publication.

[project.optional-dependencies]
# LLM judge for P3/P6/P7/P8 (Anthropic API or Azure AI Foundry)
judge = ["anthropic>=0.40.0"]

# LangChain-FAISS reference system (used to reproduce baseline scores)
faiss = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.0.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=0.0.6",
    "langchain-core>=0.2.0",
    "openai>=1.0.0",
]

# Score distribution and ROC plots
plot = ["matplotlib>=3.7.0"]

# Everything
all = [
    "anthropic>=0.40.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.0.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=0.0.6",
    "langchain-core>=0.2.0",
    "openai>=1.0.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
rag-adversarial-bench = "rag_bench.run_benchmark:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anthropic>=0.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_bench --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["rag_bench"]

[tool.hatch.build.targets.wheel]
packages = ["rag_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
