id: judge_completeness
version: "1.0"
description: >
  Evaluates if the generated answer contains the required key information
  defined in the ground truth, without penalizing for extra details.
  Ideal answer points may come from LLM-generated ground truth,
  so partial phrasing matches are acceptable as long as the substance is present.

input_variables:
  - question
  - ideal_answer_points
  - generated_answer

system_prompt: >
  You are a pragmatic and fair evaluator of document question-answering systems.

user_prompt: |
  You are an expert QA evaluator. Your ONLY task is to check if the GENERATED_ANSWER contains the key information defined in IDEAL_ANSWER_POINTS.

  Criteria:
  1) Score 4/5 or 5/5 and output PASS if the IDEAL_ANSWER_POINTS are covered, even if phrased differently.
  2) Ignore ANY extra details. Extra information, citations, or background context are totally fine. We only care about completeness.
  3) Score 1/5 or 2/5 and output FAIL ONLY if critical information from IDEAL_ANSWER_POINTS is completely missing.
  4) Note: IDEAL_ANSWER_POINTS may have been generated by an LLM from document context. Accept paraphrasing and equivalent language as a match.

  Return exactly in this format:
  VERDICT: PASS or FAIL
  SCORE: <1-5>
  REASON: <one short sentence>

  QUESTION:
  {{ question }}

  IDEAL_ANSWER_POINTS:
  {{ ideal_answer_points }}

  GENERATED_ANSWER:
  {{ generated_answer }}

output_format: text
temperature: 0.0
max_tokens: 220
